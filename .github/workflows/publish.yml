name: Publish @rollpost/contract

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@rollpost"
      - name: Install
        run: npm ci
      - name: Build
        run: ./node_modules/.bin/tsup src/index.ts src/health/index.ts src/common/index.ts --format esm,cjs --dts --sourcemap --clean
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
